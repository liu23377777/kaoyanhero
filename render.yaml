services:
  - type: web
    name: kaoyan-hero
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: DAILY_AI_REQUEST_LIMIT
        value: 10
      - key: TRUST_PROXY
        value: true
      - key: ENABLE_GOOGLE_AUTH
        value: false
      - key: ENABLE_GITHUB_AUTH
        value: false
      - key: ZJSRU_API_KEY
        sync: false
      - key: ZJSRU_BASE_URL
        value: https://tokens.zjsru.edu.cn/v1
      - key: ZJSRU_DEEPSEEK_MODEL
        value: zjsru-DeepSeek-V4-flash-0731
      - key: ZJSRU_QWEN_MODEL
        value: zjsru-qwen3.8-27b
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
